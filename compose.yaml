services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # Ключи Yandex Cloud заданы → бот ходит в meter-reader, иначе демо-распознавание.
      # Свой RECOGNIZER_URL в .env главнее.
      RECOGNIZER_URL: ${RECOGNIZER_URL:-${YC_API_KEY:+http://meter-reader:8000/recognize}}
    volumes:
      - ./data:/app/data

  # Распознавание показаний (services/meter_reader): Qwen в Yandex Cloud AI Studio. Запускается вместе с app.
  meter-reader:
    build: ./services/meter_reader
    restart: unless-stopped
    environment:
      YC_API_KEY: ${YC_API_KEY:-}
      YC_FOLDER_ID: ${YC_FOLDER_ID:-}
      YC_MODEL: ${YC_MODEL:-qwen3.6-35b-a3b}
      YC_TIMEOUT: ${YC_TIMEOUT:-15}
    ports:
      - "127.0.0.1:8000:8000"   # только для отладки с хоста (recognize.sh); наружу не открываем
