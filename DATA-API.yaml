version: "1.0.0"
solution_name: "MAX Умный Дом — Комплексная платформа ЖКХ"
team_id: "t226"
base_url: "http://localhost:8080"
bot_username: "@t226_hakaton_max_bot"
bot_id: "423938205"

test_accounts:
  - role: "resident"
    name: "Иванов Иван Иванович"
    els: "1004567890"
    address: "г. Москва, ул. Ленина, д. 42, кв. 15"
    description: "Собственник квартиры с полным доступом к счетчикам и сплит-оплате"
  - role: "tenant"
    name: "Петров Петр Сергеевич"
    guest_token: "guest_test_token_2026"
    address: "г. Москва, ул. Ленина, д. 42, кв. 15"
    description: "Арендатор без ЕСИА по гостевой ссылке MAX"
  - role: "inspector_uk"
    name: "Смирнов Алексей Викторович"
    uk_name: "ООО «УК ДОМОВОЙ СЕРВИС»"
    description: "Контролер/обходчик УК для фиксации цифровых актов с GPS"
  - role: "dispatcher_uk"
    name: "Ковалева Елена Николаевна"
    uk_name: "ООО «УК ДОМОВОЙ СЕРВИС»"
    description: "Диспетчер аварийной службы по ПП РФ № 40"

mandatory_checks:
  - id: "check_health"
    name: "Проверка работоспособности сервиса"
    method: "GET"
    path: "/api/health"
    user_role: "resident"
    parameters: {}
    expected_status: [200]
    expected_response:
      content_type: "application/json"
      required_fields:
        - "status"
        - "service"
        - "bot_username"
        - "mock_components"

  - id: "check_meters_list"
    name: "Получение реестра приборов учета квартиры (ИПУ)"
    method: "GET"
    path: "/api/meters"
    user_role: "resident"
    parameters: {}
    expected_status: [200]
    expected_response:
      content_type: "application/json"
      required_fields:
        - "id"
        - "meter_type"
        - "serial_number"
        - "last_reading_value"
        - "verification_date_valid_until"

  - id: "check_submit_reading"
    name: "Передача показаний счетчика с бизнес-валидацией и защитой от ошибки *1000"
    method: "POST"
    path: "/api/meters/submit"
    user_role: "resident"
    parameters:
      headers:
        Content-Type: "application/json"
      body:
        meter_id: "meter-khvs-1"
        reading_value: 145.5
        submission_channel: "max_miniapp"
    expected_status: [200]
    expected_response:
      content_type: "application/json"
      required_fields:
        - "is_valid"
        - "consumption"
        - "previous_value"
        - "current_value"
        - "message"

  - id: "check_ai_vision_stub"
    name: "AI-распознавание циферблата и OCR заводского номера (Заглушка)"
    method: "POST"
    path: "/api/ai/scan"
    user_role: "resident"
    parameters:
      headers:
        Content-Type: "application/json"
      body:
        device_type_hint: "cold_water"
    expected_status: [200]
    expected_response:
      content_type: "application/json"
      required_fields:
        - "is_mock"
        - "mock_notice"
        - "recognized_reading"
        - "recognized_serial_number"
        - "confidence"
        - "red_rollers_detected"

  - id: "check_arshin_antifraud"
    name: "Проверка легитимности поверки во ФГИС АРШИН и Зеленый Щит Безопасности"
    method: "GET"
    path: "/api/arshin/check"
    user_role: "resident"
    parameters:
      query:
        serial: "2809142"
    expected_status: [200]
    expected_response:
      content_type: "application/json"
      required_fields:
        - "serial_number"
        - "organization_name"
        - "valid_until"
        - "status"
        - "is_fraud_warning"
        - "safety_message"

  - id: "check_gost_qr_billing"
    name: "Парсинг QR-кода по ГОСТ Р 56042-2014 и сплит платежа на спецсчет 40821"
    method: "POST"
    path: "/api/billing/parse-qr"
    user_role: "resident"
    parameters:
      headers:
        Content-Type: "application/json"
      body:
        qr_payload: "ST00012|Name=ООО УК ДОМОВОЙ СЕРВИС|PersonalAcc=40702810938000012345|BIC=044525225|CorrespAcc=30101810400000000225|PayeeINN=7701234567|Sum=485050|PersAcc=1004567890|Period=092026|TechCode=01"
    expected_status: [200]
    expected_response:
      content_type: "application/json"
      required_fields:
        - "is_valid_gost"
        - "total_amount_rubles"
        - "is_account_checksum_valid"
        - "split_details"

  - id: "check_night_flow_leak"
    name: "Диагностика небаланса ОДПУ («Ночной дозор») и экспресс-тест салфетки"
    method: "POST"
    path: "/api/night-flow/diagnose"
    user_role: "resident"
    parameters:
      headers:
        Content-Type: "application/json"
      body:
        entrance_id: 1
        napkin_test_result: "wet"
    expected_status: [200]
    expected_response:
      content_type: "application/json"
      required_fields:
        - "entrance_odpu_flow_liters_per_hour"
        - "apartment_leak_detected"
        - "reward_eligible"
        - "diagnosis_verdict"

  - id: "check_ticket_create"
    name: "Создание заявки в УК со сроком SLA по ПП РФ № 40 от 26.01.2026 г."
    method: "POST"
    path: "/api/tickets"
    user_role: "resident"
    parameters:
      headers:
        Content-Type: "application/json"
      body:
        category: "Сантехника"
        description: "Капает кран на кухне"
        priority: "urgent"
        address: "ул. Ленина, д. 42, кв. 15"
    expected_status: [201]
    expected_response:
      content_type: "application/json"
      required_fields:
        - "id"
        - "priority"
        - "status"
        - "sla_hours"

  - id: "check_guest_access"
    name: "Генерация безопасной гостевой ссылки для арендатора без ЕСИА"
    method: "POST"
    path: "/api/guest/generate"
    user_role: "resident"
    parameters:
      headers:
        Content-Type: "application/json"
      body:
        property_id: "flat-42-15"
        tenant_name: "Петров П. С."
        duration_days: 30
    expected_status: [200]
    expected_response:
      content_type: "application/json"
      required_fields:
        - "guest_token"
        - "direct_max_link"
        - "expires_at"
        - "allowed_actions"
