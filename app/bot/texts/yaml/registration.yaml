ADDRESS_NOT_FOUND: |-
  Не нашли такой адрес. Проверьте улицу и номер дома и напишите ещё раз.

  Например: г. Москва, ул. Арбат, д. 47, корп. 1, кв. 32
ADDRESS_NOT_FOUND_ASIS: |-
  Не нашли такой адрес в справочнике ФИАС.

  Мы поняли так: {address}

  Проверьте улицу и номер дома. Если всё верно — сохраним адрес как есть, без сверки.
ADDRESS_ONE: |-
  Мы поняли так:
  {address}

  {notes}Верно?
ADDRESS_RETRY: |-
  Напишите адрес иначе — одной строкой: город, улица, дом, квартира.

  Например: г. Москва, ул. Арбат, д. 47, корп. 1, кв. 32
ASK_ADDRESS: |-
  Теперь адрес. Напишите его одной строкой: город, улица, дом, квартира.

  Например: г. Москва, ул. Арбат, д. 47, корп. 1, кв. 32
ASK_FLAT: |-
  Номер квартиры?

  {address}

  Напишите цифрами, например: 32. Если это частный дом — нажмите кнопку ниже.
ASK_NAME: |-
  Кажется, вы у нас впервые. Давайте познакомимся — три коротких шага: имя, телефон и адрес.

  Как вас зовут? Напишите фамилию, имя и отчество, например: Иванова Анна Сергеевна

  Продолжая, вы соглашаетесь на обработку персональных данных.
ASK_NAME_AGAIN: |-
  Как вас зовут? Напишите фамилию, имя и отчество.

  Сейчас записано: {name}
ASK_PHONE: Приятно познакомиться, {name}! Теперь телефон — нажмите кнопку ниже, и
  MAX передаст номер вашего аккаунта. Или напишите номер сами.
BTN_ALL_OK: Всё верно
BTN_ASIS: Сохранить как есть
