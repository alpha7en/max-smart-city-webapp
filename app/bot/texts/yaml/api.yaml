  empty: Отметьте хотя бы один адрес.
  not_owner: Делиться доступом и закрывать его может только собственник адреса.
  limit: 'Уже {count} неоткрытых ссылок — новую создать нельзя. Отмените ненужную
    или дождитесь, пока она истечёт.'
