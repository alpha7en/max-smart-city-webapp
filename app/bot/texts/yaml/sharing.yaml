# «Поделиться доступом»: собственник открывает доступ к своим адресам (одному или нескольким)
# по одноразовой ссылке. {owner}/{name} — «Анна И.», {by} — «Анны И.» (родительный падеж),
# {addresses} — «адресу Арбат 47к1, кв 32» или «адресам: Арбат 47к1, кв 32; Тверская 1, кв 5».

# --- Кнопки ---
BTN_SHARE: Поделиться доступом
BTN_SHARED: Общий доступ
BTN_ALL: Все адреса
BTN_DONE: Готово
BTN_PICKED: '✓ {label}'
BTN_CANCEL_INVITE: Отменить ссылку {n}
BTN_ACCEPT: Принять
BTN_DECLINE: Отказаться
BTN_REVOKE: 'Закрыть: {name}'
BTN_REVOKE_N: Закрыть доступ №{n}
BTN_REVOKE_YES: Закрыть доступ
BTN_REVOKE_NO: Не закрывать
BTN_ALLOW: 'Разрешить: {name}'
BTN_ALLOW_N: Разрешить №{n}
BTN_REMOVE: Выйти
BTN_REMOVE_YES: Выйти
BTN_REMOVE_NO: Отмена
BTN_NO_OWN_ADDRESS: Других адресов нет

# --- Как называть адреса в тексте ---
ADDR_ONE: адресу {address}
ADDR_MANY: 'адресам: {addresses}'
ROLE_SHARED: доступ от {by}

# --- Собственник: выбор адресов и ссылка ---
PICK: |-
  Какими адресами поделиться? Отметьте один или несколько и нажмите «Готово».

  Тот, кто примет ссылку, сможет передавать показания по этим адресам, а вы увидите, что они поданы.
PICK_EMPTY: Отметьте хотя бы один адрес.
NO_OWNED: Делиться можно адресами, где вы собственник. Сейчас таких адресов у вас
  нет.
LINK: |-
  {owner} открывает вам доступ к {addresses} в боте ЖКХ в MAX: вы сможете передавать показания счётчиков.
  Откройте ссылку: {url}
  Ссылка сработает один раз, до {until}.
SHARE_TEXT: '{owner} открывает вам доступ к {addresses} в боте ЖКХ в MAX: вы сможете
  передавать показания счётчиков. Ссылка сработает один раз, до {until}.'
CREATED: |-
  Перешлите сообщение выше тому, с кем делитесь. Ссылка сработает один раз, до **{until}**.

  Когда её примут, мы напишем вам.
LIMIT: |-
  У вас уже {count} неоткрытых ссылок — новую создать нельзя.

  Отмените ненужную в «Общий доступ» или дождитесь, пока истечёт ближайшая: **{until}**.
NO_USERNAME: Сейчас не получилось создать ссылку. Попробуйте чуть позже.

# --- Собственник: «Общий доступ» и адрес ---
SHARED_TITLE: '**Общий доступ**'
SHARED_OWNED: 'Вы делитесь:'
SHARED_OWNED_LINE: '{label} — {names}'
SHARED_INVITES: 'Неоткрытые ссылки:'
SHARED_INVITE_LINE: '{n}. {labels} — до {until}'
SHARED_RECEIVED: 'Вам открыли доступ:'
SHARED_RECEIVED_LINE: '{label} — {role}'
SHARED_HINT: Нажмите на адрес, чтобы увидеть, кто передаёт показания, или выйти
  из общего доступа.
SHARED_HINT_OWNED: Нажмите на адрес, чтобы увидеть, кто передаёт показания.
SHARED_HINT_RECEIVED: Нажмите на адрес, чтобы выйти из общего доступа.
SHARED_EMPTY: Здесь будут адреса, которыми вы делитесь или которыми поделились с вами.
ACCESS_LINE: 'Доступ: {names}'
ONLY_YOU: только вы
WAITS: ждёт
MEMBERS: |-
  {label}

  {lines}

  Закрыть доступ можно в любой момент — переданные показания останутся.
MEMBERS_EMPTY: |-
  {label}

  Показания по этому адресу передаёте только вы. Поделитесь доступом — тот, кто примет ссылку, тоже сможет их передавать.
MEMBER_LINE: '{n}. {name} — {status}'
STATUS_SUBMITTED: показания {date}
STATUS_NOT_SUBMITTED: за {month} показаний нет
STATUS_PENDING: ждёт одобрения
RECEIVED: |-
  {label} — доступ от {by}

  Вы можете передавать показания по этому адресу. Изменить адрес может только собственник. Если адрес вам больше не нужен, нажмите «Выйти».
RECEIVED_OTHER: |-
  {label} — {role}

  Если адрес вам больше не нужен, нажмите «Выйти».
OWNER_ONLY: Управлять доступом может только собственник адреса.
ADDRESS_GONE: Этого адреса уже нет в вашем профиле.

# --- Собственник закрывает доступ ---
REVOKE_ASK: |-
  Закрыть доступ: {name}, {label}?

  Передавать показания по этому адресу будет нельзя. То, что уже передано, останется.
REVOKED: 'Закрыли доступ: {name}, {label}. Мы сообщили об этом.'
REVOKE_ALREADY: 'Доступ уже закрыт: {name}.'
REVOKE_GONE: Этого человека уже нет среди тех, у кого есть доступ.
REVOKE_SELF: 'Себе доступ закрыть нельзя: вы собственник этого адреса.'
TENANT_REVOKED: |-
  Собственник закрыл вам доступ к адресу {label}.

  Показания, которые вы уже передали, сохранены. Чтобы убрать адрес из списка, откройте его в «Общий доступ» и нажмите «Выйти».

# --- Отмена ссылки ---
INVITE_CANCELLED: 'Отменили ссылку: {labels}. Если её откроют, мы скажем, что она не
  действует.'
INVITE_CANCEL_GONE: Эта ссылка уже не действует.

# --- Получатель выходит из общего доступа ---
REMOVE_ASK: |-
  Выйти из общего доступа к адресу {label}?

  Адрес пропадёт только у вас, {owner} получит уведомление. Переданные показания сохранятся.
REMOVE_ASK_CLOSED: |-
  Выйти из общего доступа к адресу {label}?

  Адрес пропадёт из вашего списка. Переданные показания сохранятся.
REMOVED: Вы вышли из общего доступа к адресу {label}.
REMOVED_NOTIFIED: Вы вышли из общего доступа к адресу {label}. {owner} получит уведомление.
REMOVE_OWN: 'Это ваш адрес. Выйти можно только из общего доступа к чужому адресу.'
OWNER_REMOVED: '{name} {left} из общего доступа к адресу {label}. Переданные показания
  остались.'

# --- Получатель открыл ссылку ---
INVALID:
  unknown: Эта ссылка не работает. Попросите прислать новую.
  expired: Срок ссылки истёк. Попросите прислать новую.
  used: Эту ссылку уже использовали — она срабатывает один раз. Попросите прислать
    новую.
  cancelled: Эту ссылку отменили. Если доступ всё-таки нужен, попросите прислать новую.
  gone: Ссылка уже не действует — адреса в ней больше не принадлежат отправителю.
SELF: Это ваша ссылка — перешлите её тому, с кем делитесь.
ALREADY: У вас уже есть доступ к {addresses} — можно передавать показания.
OFFER: |-
  {owner} открывает вам доступ к {addresses}: вы сможете передавать показания счётчиков.

  Принять?
OFFER_OWN: Адрес {label} и так ваш — он уже в профиле.
ACCEPTED: Готово, доступ от {by} к {addresses} открыт. Пришлите фото счётчика, и
  мы разберём цифры.
DECLINED: Не стали принимать доступ. Если передумаете — откройте ссылку ещё раз, пока
  она действует.
OWNER_ACCEPTED: '{name} принимает ссылку: доступ к {addresses} открыт.'

# --- Регистрация по ссылке ---
REG_INVITED: '{owner} хочет открыть вам доступ к {addresses}. Сначала коротко познакомимся.'
REG_KEPT: Ссылку запомнили — доступ откроем сразу после регистрации.
ASK_INVITE_ADDRESS: |-
  Доступ к {addresses} откроем сразу после регистрации.

  Есть ещё свой адрес, где вы передаёте показания? Напишите его одной строкой: город, улица, дом, квартира. Если нет — нажмите «Других адресов нет».
REG_SHARED_LINE: 'Доступ от {by}: {labels}'
REG_ACCEPTED: Доступ от {by} к {addresses} открыт.
REG_NOT_APPLIED: Ссылка уже не действует — доступ по ней не открыли. Попросите прислать
  новую.

# --- Удаление аккаунта ---
MEMBER_DELETED: '{name} удаляет свой профиль в боте, доступ к {addresses} закрыт. Переданные
  показания остались.'
PROMOTED: |-
  Собственник адреса {label} удаляет свой профиль в боте. Теперь собственник этого адреса в боте — вы: можно делиться доступом.
