ACCESS_ALREADY: Доступ по адресу {label} уже открыт — можно передавать показания.
ACCESS_CLAIMED: По адресу {label} больше нет собственника в боте — открыли доступ
  вам.
ACCESS_UNKNOWN: Этого адреса нет в вашем профиле.
ADDRESS_DUP: Этот адрес уже есть у вас как «{label}».
ADDRESS_EXAMPLE: 'Например: г. Москва, ул. Арбат, д. 47, корп. 1, кв. 32'
ADDRESS_SAVED: 'Добавили адрес: {label}.'
ASK_ADDRESS: |-
  Напишите новый адрес одной строкой: город, улица, дом, квартира.

  Например: г. Москва, ул. Арбат, д. 47, корп. 1, кв. 32
ASK_PHONE: |-
  Сейчас: {phone}

  Нажмите кнопку ниже, и MAX передаст номер вашего аккаунта. Или напишите новый номер.
BTN_ADD_ADDRESS: Добавить адрес
BTN_ALLOW: Разрешить
BTN_DELETE: Удалить мои данные
BTN_DELETE_NO: Не удалять
BTN_DELETE_YES: Удалить
BTN_DEMO_GRANT: Открыть доступ (демо)
BTN_DENY: Отклонить
BTN_EDIT_PHONE: Изменить телефон
BTN_PROFILE: Профиль
BTN_REQUEST: Запросить доступ
BTN_REQUEST_FOR: 'Доступ: {label}'
BTN_START_OVER: Начать заново
BTN_SUBMIT: Подать показания
DECIDED:
  granted: Уже решено — доступ открыт.
  denied: Уже решено — в доступе отказано.
DELETED: Удалили ваши данные. Если захотите вернуться — нажмите «Начать заново» или
  просто напишите нам.
DELETE_ASK: |-
  Удалить ваши данные? Сотрём имя, телефон и адреса в профиле.

  Показания, которые вы передали, останутся за адресом, но без вашего имени. Отменить удаление нельзя.
DELETE_KEPT: Ничего не удалили.
DEMO_GRANTED: Доступ открыт. Можно передавать показания.
DEMO_GRANTED_NOTE: 'Демо-режим: доступ мы одобрили за собственника.'
NO_ACCESS: |-
  По адресу {label} уже зарегистрирован собственник. Передавать показания может он или тот, кому он откроет доступ.

  Если вы снимаете жильё или живёте с собственником — нажмите «Запросить доступ». Мы пришлём ему запрос: достаточно нажать «Разрешить», и мы сразу напишем вам.

  Если адрес указан с ошибкой — проверьте профиль.
NO_ACCESS_DENIED: |-
  Собственник не открыл вам доступ по адресу {label}.

  Если это ошибка — свяжитесь с ним напрямую или проверьте адрес в профиле.
NO_ADDRESSES: пока нет
OWNER_DENIED: 'Отклонили запрос: {name}, {label}. Мы сообщили об этом.'
OWNER_GRANTED: 'Открыли доступ: {name}, {label}. Мы сообщили об этом.'
OWNER_ONLY: Ответить на запрос может только собственник адреса.
OWNER_REQUEST: |-
  {name} просит доступ к передаче показаний по адресу {label}.
  Телефон: {phone}

  Если это ваш арендатор или член семьи — разрешите.
PHONE_SAVED: Сохранили новый номер.
PROFILE: |-
  Ваш профиль

  {name}
  {phone}

  Адреса:
  {addresses}
REQUEST_DUP: Запрос уже отправлен. Как только собственник ответит, мы напишем вам.
REQUEST_FAILED: Не получилось отправить запрос собственнику. Попробуйте ещё раз чуть
  позже.
REQUEST_GONE: 'Запрос устарел: человек удалил свои данные или этот адрес.'
REQUEST_SENT: Отправили запрос собственнику. Как только он ответит, мы напишем вам.
RIGHTS_MODEL: 'Права по адресам в демо-версии смоделированы: собственник — тот, кто
  зарегистрировался первым.'
ROLE:
  owner_granted: собственник
  tenant_granted: есть доступ
  tenant_pending: нужно одобрение собственника
  tenant_denied: собственник не открыл доступ
TENANT_DENIED: |-
  Собственник не открыл вам доступ по адресу {label}.

  Если это ошибка — свяжитесь с ним напрямую или проверьте адрес в профиле.
TENANT_GRANTED: Собственник открыл вам доступ по адресу {label}. Теперь можно передавать
  показания — достаточно прислать фото счётчика.
